<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .verify {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            border: 2px solid ;
            background-color: #261D47;
        }

        .box-q{
            width:  600px;
            height: 200px;
            border-radius: 15px;
            padding: 30px;
            background-color: white;
            box-shadow: 1px 10px 1px rgba(0, 0, 0, 0.548);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
            

        .workerverify{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5%;
            width: 100%;            
            height: 30%;
        }

        #title{
            text-align: center;
            font-size: 20px;
            padding: 10px;
            font-weight: bold;
        }
        .workerverify button{
            width: 50%;
            padding: 10px;
            border: 0;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
        }
        #confirm{
            background-color: rgba(153, 255, 0, 0.79);
            color: green;
        }
        #recused{
            background-color: rgba(255, 0, 0, 0.79);
            color: rgb(97, 0, 0);
        }
    </style>
</head>

<body>
    <div class="verify">
        <div class="box-q">
            <p id="title">esse usuario é um funcionário {{user}}?</p>
            <div class="workerverify">
                <button onclick="Confirmation(true, '{{token}}')" id="confirm">sim</button>
                <button onclick="Confirmation(false, '{{token}}')" id="recused">não</button>
            </div>
        </div>
    </div>

    <script>
        function getCSRFToken() {
            return document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        }

        async function Confirmation(confirm, token) {
            console.log(token)
            try {
                const response = await fetch(`http://localhost:8000/worker/confirmation/${token}/`, {
                    method: 'POST',
                    headers: {
                        "Content-type": 'application/json',
                        'X-CSRFToken': getCSRFToken()
                    },
                    body: JSON.stringify({ is_worker: confirm })
                })
            }
            catch (err) {
                console.log('deu erro:' + err)
            }

            setTimeout(() => {
                location.reload()
            }, 1500)
        }
    </script>
</body>

</html>
